# Opening the death flag of the living entity, which is what the slay core writes by hand for a target
# that guards its own death. See dev.polaris_light.constructionwand.plus.basics.SlayHandler.
#
# The tail of the death path (dropAllDeathLoot) is deliberately NOT widened here: subclasses override it
# with the same, protected visibility, and an access transformer that lifts the base method to public
# makes every one of those overrides an illegal visibility reduction (the game no longer compiles). It is
# reached reflectively instead.
#
# NeoForge 1.21 runs on Mojang's official names, so the AT uses the readable ones.
public net.minecraft.world.entity.LivingEntity dead

# The guaranteed loot of the slay core lists every item a victim's loot table can produce, which needs the
# inside of the table: the pools, their entries and the fields the entry types keep their content in. This
# is the same approach the Just Enough Resources addon takes to show mob drops.
public net.minecraft.world.level.storage.loot.LootTable pools
public net.minecraft.world.level.storage.loot.LootPool entries
public net.minecraft.world.level.storage.loot.entries.LootItem item
public net.minecraft.world.level.storage.loot.entries.TagEntry tag
public net.minecraft.world.level.storage.loot.entries.NestedLootTable contents
public net.minecraft.world.level.storage.loot.entries.CompositeEntryBase children
public net.minecraft.world.level.storage.loot.entries.DynamicLoot name