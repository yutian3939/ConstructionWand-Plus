import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.7'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.2'
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.mod_name

// Set the toolchain version to decouple the Java we run Gradle with from the Java used to compile and run the mod
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        // Azul covers the most platforms for Java 8 toolchains, crucially including MacOS arm64
        vendor.set(JvmVendorSpec.AZUL)
    }
    // Generate a sources jar for distribution.
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = '1.12.2'

    // MCP Mappings
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    
    // Set username here, the UUID will be looked up automatically
    username = 'Developer'
    
    // Add various JVM arguments here for runtime
    def args = [
            "-ea:${project.group}",
            "-Dfml.coreMods.load=com.xinyihl.constructionwandlegacy.coremod.LightingCorePlugin"
    ]
    extraRunJvmArguments.addAll(args)

    // Include and use dependencies' Access Transformer files
    useDependencyAccessTransformers = true
    
    // Add any properties you want to swap out for a dynamic value at build time here
    // Any properties here will be added to a class at build time, the name can be configured below
    injectedTags.put('MOD_ID', project.archives_base_name)
    injectedTags.put('MOD_NAME', project.mod_name)
    injectedTags.put('VERSION', project.version)
}

// Generate a group.archives_base_name.Tags class
tasks.injectTags.configure {
    outputClassName.set("${project.group}.${project.archives_base_name}.Tags")
}

repositories {
    maven {
        name 'CurseMaven'
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
}

// Mods shipped with the workspace, deobfuscated out of the local libs/ folder.
def workspaceMods = ['rawinput-1.8.0.jar', 'Chameleon-1.12-4.1.3.jar', 'StorageDrawers-1.12.2-5.4.2.jar',
                     'Netherending-Ores-1.12.2-1.3.jar']
        .collect { files("libs/${it}") }

dependencies {
    // Optional compatibility mods are compile-time only; install them separately for integration runs.
    implementation rfg.deobf("curse.maven:baubles-227083:2518667")
    implementation rfg.deobf("curse.maven:projecte-226410:2702991")
    implementation rfg.deobf("curse.maven:ae2extendedlife-570458:6302098")

    // Development environment: the mods used while testing the wand in game.
    workspaceMods.each { implementation rfg.deobf(it) }
    implementation rfg.deobf('curse.maven:tinkers-construct-74072:2902483')
    implementation rfg.deobf('curse.maven:mantle-74924:2713386')
    implementation rfg.deobf('curse.maven:jei-238222:3040523')

    testImplementation 'junit:junit:4.13.2'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    filesMatching(['mcmod.info', 'pack.mcmeta']) { fcd ->
        fcd.expand (
                'version': project.version,
                'mcversion': project.minecraft.version
        )
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Run Obfuscated Client"(Gradle) {
                    taskNames = ["runObfClient"]
                }
                "4. Run Obfuscated Server"(Gradle) {
                    taskNames = ["runObfServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

tasks.named("processIdeaSettings").configure {
    dependsOn("injectTags")
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'com.xinyihl.constructionwandlegacy.coremod.LightingCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
